name: Build DamaiPocket Rootless App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "DamaiPocketApp/**"
      - ".github/workflows/build-deb.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install ldid dpkg

      - name: Install Theos
        run: |
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install iPhoneOS 16.5 SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          test -d "$RUNNER_TEMP/theos-sdks/iPhoneOS16.5.sdk"
          mkdir -p "$HOME/theos/sdks"
          cp -R "$RUNNER_TEMP/theos-sdks/iPhoneOS16.5.sdk" "$HOME/theos/sdks/"

      - name: Build rootless app package
        working-directory: DamaiPocketApp
        run: |
          export THEOS="$HOME/theos"
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Verify DEB and app bundle
        run: |
          set -e
          DEB="$(find DamaiPocketApp/packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$DEB"
          dpkg-deb -I "$DEB"
          dpkg-deb -c "$DEB" | grep -E 'DamaiPocket\.app/(Info\.plist|DamaiPocket)$'

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: DamaiPocket-Rootless-DEB
          path: DamaiPocketApp/packages/*.deb
          if-no-files-found: error
          retention-days: 30
