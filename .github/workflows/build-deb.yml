name: Build DamaiPocket Dopamine Tweak

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "DamaiPocketTweak/**"
      - ".github/workflows/build-deb.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils libxml2-dev libtinfo6 libio-compress-lzma-perl libplist-2.0-4

      - name: Install Theos and iOS toolchain
        run: |
          env THEOS="$HOME/theos" CI=true bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/toolchain/linux/iphone/bin" >> "$GITHUB_PATH"

      - name: Install iPhoneOS 16.5 SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          curl -fL --retry 3 https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz -o "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz"
          tar -xJf "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" -C "$HOME/theos/sdks"
          test -d "$HOME/theos/sdks/iPhoneOS16.5.sdk"

      - name: Build rootless tweak
        working-directory: DamaiPocketTweak
        run: |
          export THEOS="$HOME/theos"
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Verify rootless package
        run: |
          set -euo pipefail
          DEB="$(find DamaiPocketTweak/packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$DEB"
          dpkg-deb -I "$DEB"
          dpkg-deb -c "$DEB" | tee package-files.txt
          grep -E 'var/jb/Library/MobileSubstrate/DynamicLibraries/DamaiPocket\.dylib' package-files.txt
          grep -E 'var/jb/Library/MobileSubstrate/DynamicLibraries/DamaiPocket\.plist' package-files.txt

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: DamaiPocket-Dopamine-DEB
          path: DamaiPocketTweak/packages/*.deb
          if-no-files-found: error
          retention-days: 30
